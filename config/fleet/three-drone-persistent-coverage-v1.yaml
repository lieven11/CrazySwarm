schema_version: 1
deployment_id: three-drone-persistent-coverage-v1

fleet:
  - vehicle_id: cf01
    display_name: Coverage One
    home: {x: -1.2, y: 0.0, z: 0.0}
    initial_role: ACTIVE
    required: true
    required_capabilities: [relative_positioning, high_level_commands]
  - vehicle_id: cf02
    display_name: Coverage Two
    home: {x: 1.2, y: 0.0, z: 0.0}
    initial_role: ACTIVE
    required: true
    required_capabilities: [relative_positioning, high_level_commands]
  - vehicle_id: cf03
    display_name: Coverage Reserve
    home: {x: 0.0, y: -1.5, z: 0.0}
    initial_role: RESERVE
    required: true
    required_capabilities: [relative_positioning, high_level_commands]

zones:
  - zone_id: zone-a
    geometry:
      minimum_m: {x: -1.5, y: -0.3, z: 0.0}
      maximum_m: {x: -0.9, y: 0.3, z: 0.5}
  - zone_id: zone-b
    geometry:
      minimum_m: {x: 0.9, y: -0.3, z: 0.0}
      maximum_m: {x: 1.5, y: 0.3, z: 0.5}

tasks:
  - task_id: cover-zone-a
    task_type: persistent-zone-coverage
    zone_id: zone-a
    priority: 200
    mission_id: hover
    mission_parameters: {height_m: 0.3, duration_s: 30.0}
    required_capabilities: [relative_positioning, high_level_commands]
    completion_progress_percent: 100.0
    estimated_duration_s: 300.0
    estimated_energy_percent: 40.0
    energy_margin_percent: 15.0
  - task_id: cover-zone-b
    task_type: persistent-zone-coverage
    zone_id: zone-b
    priority: 190
    mission_id: hover
    mission_parameters: {height_m: 0.3, duration_s: 30.0}
    required_capabilities: [relative_positioning, high_level_commands]
    completion_progress_percent: 100.0
    estimated_duration_s: 300.0
    estimated_energy_percent: 40.0
    energy_margin_percent: 15.0

constraints:
  warning_separation_m: 0.75
  critical_separation_m: 0.5
  observation_freshness_s: 1.0
  child_failure_policy: CONTINUE_HEALTHY

docks:
  - dock_id: dock-main
    capacity: 1

completion_policy:
  require_all_tasks: true
  allow_partial_fleet: false
