  - PRIORITY_INVERSION
  - STARVATION
  - MISSION_COMPLETION_TIME_S
  - MAXIMUM_WAIT_S
  - TOTAL_ENERGY_PERCENT
  - AIRBORNE_HOVER_TIME_S
