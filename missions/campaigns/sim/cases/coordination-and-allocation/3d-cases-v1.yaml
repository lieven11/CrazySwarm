  - ACCELERATION_M_S2
  - JERK_M_S3
  - SEPARATION_ROBUSTNESS_M
  - BOUNDARY_ROBUSTNESS_M
  expected_decisions:
  - DIRECT
  - GROUND_DELAY
  - HORIZONTAL_DETOUR
  - VERTICAL_LAYER
  pass_fail_metrics:
  - metric_id: minimum_truth_separation_m
    comparator: GREATER_THAN_OR_EQUAL
    threshold: 0.75
    unit: m
  - metric_id: maximum_tracking_rms_m
    comparator: LESS_THAN_OR_EQUAL
    threshold: 0.05
    unit: m
  - metric_id: maximum_tracking_error_m
    comparator: LESS_THAN_OR_EQUAL
    threshold: 0.1
    unit: m
  - metric_id: maximum_touchdown_horizontal_error_m
    comparator: LESS_THAN_OR_EQUAL
    threshold: 0.1
    unit: m
  - metric_id: maximum_touchdown_vertical_error_m
    comparator: LESS_THAN_OR_EQUAL
    threshold: 0.08
    unit: m
  - metric_id: maximum_terminal_speed_m_s
    comparator: LESS_THAN_OR_EQUAL
    threshold: 0.05
    unit: m/s
  execution_eligibility: BOTH
  operator_observation_questions:
  - Did displayed motion remain smooth without hiding delayed evidence?
  - Did every role reach the declared goal and landing region?
  - Did the selected strategy match the pre-play rationale?
  difficulty: 7
  prerequisites:
  - 1d.takeoff_hover_land.canonical_nominal
  claim_boundary: Bounded Fast Sim behavior for at most three drones; no physical-flight
